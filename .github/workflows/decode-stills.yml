name: decode-stills
on:
  push:
    paths:
      - '**/*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 to binary siblings
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            base64 -d < "$f" > "$out"
            echo "decoded $f -> $out ($(wc -c < "$out") bytes)"
            found=1
          done < <(find . -type f -name '*.b64' -print0)
          if [ "$found" -eq 0 ]; then echo "no .b64 files"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "decode stills from b64"
            git push
          fi
